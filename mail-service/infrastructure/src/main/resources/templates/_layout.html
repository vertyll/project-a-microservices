<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(heading, body)">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${heading}">VEDS</title>
    <style>
      body {
        margin: 0;
        padding: 24px 16px;
        background: #f9fafb;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        color: #111827;
        line-height: 1.6;
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 24px 16px;
      background: #f9fafb;
      font-family:
        &quot;Inter&quot;,
        -apple-system,
        BlinkMacSystemFont,
        &quot;Segoe UI&quot;,
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      color: #111827;
      line-height: 1.6;
    "
  >
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="100%"
      style="max-width: 560px; margin: 0 auto"
    >
      <tr>
        <td style="padding: 0 0 20px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; color: #111827">
          VEDS
        </td>
      </tr>
      <tr>
        <td style="background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 28px">
          <h1 th:text="${heading}" style="margin: 0 0 16px; font-size: 18px; font-weight: 600; color: #111827">
            Heading
          </h1>
          <div th:replace="${body}">Content</div>

          <p style="margin: 24px 0 0; color: #6b7280; font-size: 14px">Sign in to VEDS to see the details.</p>
          <p style="margin: 16px 0 0; color: #111827; font-size: 14px">Best regards,</p>
          <p style="margin: 2px 0 0; color: #111827; font-size: 14px; font-weight: 500">The VEDS Team</p>
        </td>
      </tr>
      <tr>
        <td style="padding: 16px 4px 0; color: #9ca3af; font-size: 12px; text-align: center">
          <p style="margin: 0">
            &copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span>
            VEDS. All rights reserved.
          </p>
          <p style="margin: 4px 0 0">This is an automated message, please do not reply.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
