<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{_layout :: page('New project member', ~{::content})}">
  <body>
    <div th:fragment="content" th:remove="tag">
      <p style="margin: 0; color: #374151; font-size: 15px">A new member has joined a project you take part in.</p>
      <table
        role="presentation"
        cellpadding="0"
        cellspacing="0"
        border="0"
        style="margin: 16px 0; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; width: 100%"
      >
        <tr>
          <td style="padding: 12px 16px; font-size: 14px">
            <span style="color: #6b7280">Role</span>:
            <strong style="color: #111827" th:text="${roleName}">value</strong>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
