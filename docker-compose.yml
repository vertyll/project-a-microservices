services:
  # Postgres databases for each service
  iam-db:
    image: postgres:18-alpine
    container_name: iam-db
    restart: always
    volumes:
      - iam-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iam_db
    ports:
      - "5432:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iam_db -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  mail-db:
    image: postgres:18-alpine
    container_name: mail-db
    restart: always
    volumes:
      - mail-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mail_service
    ports:
      - "5433:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mail_service -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  project-db:
    image: postgres:18-alpine
    container_name: project-db
    restart: always
    volumes:
      - project-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_service
    ports:
      - "5435:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_service -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  task-db:
    image: postgres:18-alpine
    container_name: task-db
    restart: always
    volumes:
      - task-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_service
    ports:
      - "5436:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_service -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-db:
    image: postgres:18-alpine
    container_name: notification-db
    restart: always
    volumes:
      - notification-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification_service
    ports:
      - "5437:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_service -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  translation-db:
    image: postgres:18-alpine
    container_name: translation-db
    restart: always
    volumes:
      - translation-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: translation_service
    ports:
      - "5438:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d translation_service -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  file-db:
    image: postgres:18-alpine
    container_name: file-db
    restart: always
    volumes:
      - file-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: file_service
    ports:
      - "5439:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d file_service -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Session store for the API Gateway's Token Handler (BFF).
  gateway-session-store:
    image: redis:8-alpine
    container_name: gateway-session-store
    restart: always
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:-local-redis-password}"
      - "--maxmemory-policy"
      - "noeviction"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-local-redis-password}
    volumes:
      - gateway-session-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # RedisInsight
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: always
    ports:
      - "8001:5540"
    networks:
      - microservices-network

  # Object storage.
  object-storage:
    image: dxflrs/garage:v1.0.1
    container_name: object-storage
    restart: always
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - object-storage-data:/var/lib/garage/data
      - object-storage-meta:/var/lib/garage/meta
    ports:
      # S3 API
      - "9100:3900"
      # Admin API, used by the console and by the bootstrap job
      - "9102:3903"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # One-shot bootstrap.
  object-storage-init:
    image: docker.io/library/alpine:3.20
    container_name: object-storage-init
    depends_on:
      object-storage:
        condition: service_healthy
    volumes:
      - ./infra/garage/bootstrap.sh:/bootstrap.sh:ro
    environment:
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-veds-files}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-GK7b3f9c1e4a5d2086f1c3b5a7}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-4f8a1c6e9b2d5307a8e1f4c7b0d3a6e92c5f8b1d4a7e0c3f6b9d2a5e8c1f4b7d}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      GARAGE_ADMIN_URL: http://object-storage:3903
      GARAGE_ADMIN_TOKEN: veds-local-admin-token
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl jq >/dev/null && sh /bootstrap.sh"]
    networks:
      - microservices-network

  # Browser console for the object store.
  object-storage-ui:
    image: noooste/garage-ui:latest
    container_name: object-storage-ui
    restart: always
    depends_on:
      object-storage:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
    environment:
      GARAGE_UI_GARAGE_TOML: /etc/garage.toml
      GARAGE_UI_GARAGE_ENDPOINT: http://object-storage:3900
      GARAGE_UI_GARAGE_ADMIN_ENDPOINT: http://object-storage:3903
    ports:
      - "9101:8080"
    networks:
      - microservices-network

  # Kafka and Zookeeper for event-driven communication
  kafka:
    image: docker.io/confluentinc/cp-kafka:8.2.2
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Schema Registry for managing Avro schemas, configured to connect to the Kafka broker
  schema-registry:
    image: docker.io/confluentinc/cp-schema-registry:8.2.2
    container_name: schema-registry
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: "1"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-shot bootstrap: provisions Kafka topics from the same Terraform module
  topics-init:
    image: docker.io/hashicorp/terraform:1.7.5
    container_name: topics-init
    depends_on:
      kafka:
        condition: service_healthy
    working_dir: /infra
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        terraform init -input=false -no-color &&
        terraform apply -auto-approve -input=false -no-color
        -var='bootstrap_servers=["kafka:9092"]'
        -var=replication_factor=1
        -var=partitions=1
    volumes:
      - ./infra/kafka:/infra
    networks:
      - microservices-network
    restart: "no"

  # One-shot bootstrap: registers every Avro schema under contracts to the Schema Registry
  schemas-init:
    image: docker.io/library/python:3.11-alpine
    container_name: schemas-init
    depends_on:
      schema-registry:
        condition: service_healthy
    working_dir: /work
    command:
      - python
      - scripts/schema_registry/register_schemas.py
      - --registry-url
      - http://schema-registry:8081
      - --compatibility
      - BACKWARD
    volumes:
      - ./scripts:/work/scripts:ro
      - ./contracts:/work/contracts:ro
    networks:
      - microservices-network
    restart: "no"

  # Keycloak for identity and access management, configured to use a Postgres database and import a realm on startup
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.6.4
    restart: always
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_pass
      KC_DB_SCHEMA: public
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "9000:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      - ./keycloak/realm-config/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Keycloak database
  keycloak-db:
    image: postgres:18-alpine
    container_name: keycloak-db
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_pass
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Kafbat UI
  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafbat-ui
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      topics-init:
        condition: service_completed_successfully
      schemas-init:
        condition: service_completed_successfully
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"
    restart: always
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Web service for mail testing
  mail-dev:
    image: maildev/maildev:latest
    container_name: mail-dev
    restart: always
    ports:
      - "1025:1025"
      - "1080:1080"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:1080/index.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  microservices-network:
    driver: bridge

volumes:
  iam-postgres-data:
  mail-postgres-data:
  project-postgres-data:
  task-postgres-data:
  notification-postgres-data:
  translation-postgres-data:
  file-postgres-data:
  object-storage-data:
  object-storage-meta:
  gateway-session-data:
  kafka-data:
  keycloak-postgres-data:
