spring:
  data:
    redis:
      host: ${REDIS_HOST:gateway-session-store}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
        bundle: ${REDIS_SSL_BUNDLE:}
  application:
    name: api-gateway

  # The gateway usually sits behind a TLS-terminating ingress. Without this, the
  # OAuth redirect_uri and Set-Cookie would be built from the internal http
  # scheme and the browser would refuse the Secure cookie.
  web:
    resources:
      add-mappings: false

  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
    gateway:
      server:
        webflux:
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: "${CORS_ALLOWED_ORIGINS:*}"
                allowedMethods: "${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}"
                allowedHeaders: "${CORS_ALLOWED_HEADERS:*}"
                allowCredentials: true
          routes:
            - id: iam-service
              uri: ${IAM_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/auth/**, /users/**, /roles/**, /permissions/**
            - id: mail-service
              uri: ${MAIL_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/mail/**
            - id: project-service
              uri: ${PROJECT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/projects/**, /project-types/**, /project-roles/**, /project-user-roles/**
            - id: task-service
              uri: ${TASK_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/tasks/**
            - id: translation-service
              uri: ${TRANSLATION_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/translations/**, /admin/translations/**
            - id: file-service
              uri: ${FILE_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/files/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/notifications/**, /ws/notifications/**

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: ${SERVER_PORT:8080}
  # Honor X-Forwarded-* from the ingress. Required for correct https redirect
  # URIs; must only be enabled when a trusted proxy actually sets them.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  ssl:
    # Set to true only when TLS terminates in this process rather than at the
    # ingress. With an ingress, leave disabled and let it hold the certificate.
    enabled: ${SERVER_SSL_ENABLED:false}
    bundle: ${SERVER_SSL_BUNDLE:}

logging:
  level:
    root: WARN
    com.vertyll.veds: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    reactor.netty.http.client: INFO

veds:
  shared:
    keycloak:
      cookie:
        secure: true
  gateway:
    session:
      encryption-key: ${GATEWAY_SESSION_ENCRYPTION_KEY}
      ttl: ${GATEWAY_SESSION_TTL:7d}
