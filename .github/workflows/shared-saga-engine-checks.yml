name: Shared Saga Engine Checks

on:
  push:
    branches:
      - main
    paths:
      - "shared-saga-engine/**"
      - "shared-messaging-kafka/**"
      - "shared-saga-api/**"
      - ".github/workflows/shared-saga-engine-checks.yml"
      - ".github/workflows/quality-checks.yml"
  pull_request:
    branches:
      - main
    paths:
      - "shared-saga-engine/**"
      - "shared-messaging-kafka/**"
      - "shared-saga-api/**"
      - ".github/workflows/shared-saga-engine-checks.yml"
      - ".github/workflows/quality-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality-checks.yml
    with:
      service: shared-saga-engine
