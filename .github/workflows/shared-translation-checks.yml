name: Shared Translation Checks

on:
  push:
    branches:
      - main
    paths:
      - "shared-translation/**"
      - ".github/workflows/shared-translation-checks.yml"
      - ".github/workflows/quality-checks.yml"
  pull_request:
    branches:
      - main
    paths:
      - "shared-translation/**"
      - ".github/workflows/shared-translation-checks.yml"
      - ".github/workflows/quality-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality-checks.yml
    with:
      service: shared-translation
