# Garage configuration for local development.
#
# Single node, replication factor 1: this is a laptop, not a cluster. Production
# overrides this file — nothing here is meant to survive a real deployment.

metadata_dir = "/var/lib/garage/meta"
data_dir     = "/var/lib/garage/data"
db_engine    = "sqlite"

replication_factor = 1

rpc_bind_addr   = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

# Fixed so the bootstrap job can talk to the node on a fresh volume. A real
# deployment generates this per node with `openssl rand -hex 32`.
rpc_secret = "2b4c1a5f9e8d7c6b3a2f1e0d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b"

[s3_api]
s3_region  = "garage"
api_bind_addr = "[::]:3900"
# Empty on purpose: path-style access only. Virtual-host style would need
# wildcard DNS, which a compose file does not have — hence
# `pathStyleAccessEnabled(true)` in ObjectStorageConfig.
root_domain = ""

[admin]
api_bind_addr = "[::]:3903"
admin_token   = "veds-local-admin-token"
metrics_token = "veds-local-metrics-token"
