spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
  kafka:
    schema-registry-url: mock://task-service-test
    consumer:
      auto-offset-reset: earliest
      group-id: task-service-test
    properties:
      schema.registry.url: mock://task-service-test

veds:
  translation:
    supported-languages: pl,en
    client:
      base-url: http://localhost:1

logging:
  level:
    com.vertyll.veds: DEBUG
    org.testcontainers: INFO
